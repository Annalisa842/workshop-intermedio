<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop intermedio · Esercizi pratici</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0e14; --bg-grad-1: #11263a; --card: #141925; --card-hover: #1a2030;
        --border: #232a3a; --text: #e7ecf3; --muted: #8b95a7; --accent: #f7931a;
        --accent-soft: rgba(247,147,26,.12); --mono-bg: #0d111a;
        --btc: #f7931a; --btc-bg: rgba(247,147,26,.12);
        --eth: #7b94f0; --eth-bg: rgba(98,126,234,.16);
        --trx: #ff4d4d; --trx-bg: rgba(255,77,77,.13);
        --bnb: #f3ba2f; --bnb-bg: rgba(243,186,47,.13);
        --sol: #b98cff; --sol-bg: rgba(153,69,255,.16);
        --success: #3ecf8e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Inter", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; -webkit-font-smoothing: antialiased; }
      .hero { background: radial-gradient(1200px 400px at 15% -10%, var(--bg-grad-1), transparent 60%), radial-gradient(900px 360px at 100% 0%, rgba(247,147,26,.10), transparent 55%), var(--bg); border-bottom: 1px solid var(--border); padding: 56px 0 40px; }
      .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
      .brand span { font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      h1 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
      .subtitle { color: var(--muted); font-size: 16px; margin-top: 12px; max-width: 680px; }
      .search-wrap { position: relative; margin-top: 28px; max-width: 440px; }
      .search-wrap > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
      #search { width: 100%; height: 46px; padding: 0 16px 0 42px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 15px; font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
      #search::placeholder { color: var(--muted); }
      #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      main { padding: 40px 0 64px; }
      .group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .group-head h2 { font-size: 22px; font-weight: 700; }
      .count { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; transition: transform .15s, border-color .15s, background .15s; }
      .card.wide { grid-column: 1 / -1; }
      .card:hover { transform: translateY(-2px); border-color: #2e3850; background: var(--card-hover); }
      .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .name-row { display: flex; align-items: baseline; gap: 8px; }
      .num { color: var(--muted); font-size: 13px; font-weight: 600; }
      .name { font-size: 17px; font-weight: 700; }
      .chip { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
      .chip.btc { color: var(--btc); background: var(--btc-bg); }
      .chip.trx { color: var(--trx); background: var(--trx-bg); }
      .chip.bnb { color: var(--bnb); background: var(--bnb-bg); }
      .chip.eth { color: var(--eth); background: var(--eth-bg); }
      .chip.sol { color: var(--sol); background: var(--sol-bg); }
      .description { color: var(--muted); font-size: 14px; }
      .label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
      .addr-row { display: flex; align-items: stretch; gap: 8px; }
      .addr { flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; background: var(--mono-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: #c7d0de; word-break: break-all; }
      .copy { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #1a1205; border: none; border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s, transform .1s; }
      .copy:hover { background: #ffa733; } .copy:active { transform: scale(.96); } .copy.done { background: var(--success); color: #052517; }
      .noresults { display: none; text-align: center; color: var(--muted); padding: 48px 0; }
      footer { border-top: 1px solid var(--border); padding: 24px 0; text-align: center; color: var(--muted); font-size: 13px; }
      @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .card.wide { grid-column: auto; } h1 { font-size: 32px; } }
      @media (max-width: 480px) { .addr-row { flex-direction: column; } .copy { min-height: 42px; justify-content: center; } }
      @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --bg-grad-1: #e6eef6; --card: #fff; --card-hover: #fff; --border: #e3e7ee; --text: #131722; --muted: #687486; --mono-bg: #f4f6f9; }
